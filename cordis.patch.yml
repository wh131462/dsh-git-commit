# Smart commit: one Host row plus its Client half. The profile's own patch layer
# may repeat this id to override any field below.
- insert:
    - id: smart-commit
      name: '@eternalheart/dsh-git-commit'
      config:
        # auto prefers Git, then falls back to SVN; git / svn pin one adapter.
        vcs: auto
        # Git executable; empty lets the plugin find one for a Finder-launched app.
        gitPath: ''
        # SVN executable; empty probes /usr/bin/svn, Homebrew, /usr/local/bin/svn.
        svnPath: ''
        # Per-invocation git/svn deadline.
        timeoutMs: 20000
        # One model call decides the groups and names them, on this Session's route.
        useModel: true
        modelTimeoutMs: 60000
        # Character budget for one planning request: numbered list plus diff.
        maxInputChars: 32000
        maxTokens: 2000
        # Extra targeted model rounds for headers that failed validation.
        repairRounds: 1
